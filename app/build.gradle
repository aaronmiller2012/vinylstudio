// W2: privacy disclosure is a prerequisite of *every* release entry point,
// including direct `./gradlew bundleRelease`, not just a NAS shell wrapper.
// Debug and host-only tasks must remain usable before the page is published.
def requireReleasePrivacy = tasks.register('validateReleasePrivacy') {
    group = 'verification'
    description = 'Rejects a release variant without a configured public HTTPS privacy URL.'
    doLast {
        def candidate = (System.getenv('VINYL_PRIVACY_URL') ?: '').trim()
        if (!candidate.startsWith('https://'))
            throw new GradleException('Release blocked: set VINYL_PRIVACY_URL to the published HTTPS privacy policy.')
        URI parsed
        try { parsed = new URI(candidate) }
        catch (Exception invalid) { throw new GradleException('Release blocked: invalid VINYL_PRIVACY_URL.', invalid) }
        def host = parsed.host?.toLowerCase(java.util.Locale.ROOT)
        if (!host || parsed.userInfo || parsed.fragment || (parsed.port != -1 && parsed.port != 443) ||
                host == 'localhost' || host.endsWith('.local') || host.endsWith('.test') ||
                host.endsWith('.invalid') || host.endsWith('.example') || host == 'example.com' ||
                host == 'www.example.com' || candidate.toLowerCase(java.util.Locale.ROOT).contains('[replace') ||
                candidate.contains('YOUR-'))
            throw new GradleException('Release blocked: privacy URL must be a real public HTTPS page.')
        // The NAS Play script additionally FETCHES the page and verifies contact details.
        // This task intentionally runs without a network request for reproducible CI/offline tests.
    }
}
tasks.configureEach { task ->
    if (task.name in ['bundleRelease', 'assembleRelease', 'lintRelease',
            'testReleaseUnitTest', 'packageRelease', 'preReleaseBuild']) task.dependsOn(requireReleasePrivacy)
}

// Stage-1 instrumentation remains framework-only; production EXIF handling uses AndroidX.

// AndroidX EXIF supports all eight orientations with consistent provider stream parsing.
dependencies {
    implementation "androidx.exifinterface:exifinterface:1.4.2"
    // RestrictTo.Scope metadata referenced by EXIF must also be on javac's classpath.
    implementation "androidx.annotation:annotation:1.9.1"
    implementation "org.locationtech.jts:jts-core:1.20.0"
    testImplementation "junit:junit:4.13.2"
}

// Keep diagnostics visible; do not hide unchecked conversions or deprecated API use.
tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:deprecation', '-Xlint:unchecked']
}
