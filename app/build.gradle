plugins { id 'com.android.application' }

// The Play build supplies an actual HTTPS policy URL via an environment variable.
// Debug/host builds remain usable without publishing a placeholder URL.
def vinylPrivacyUrl = (System.getenv('VINYL_PRIVACY_URL') ?: '').trim()
android { namespace 'com.halftonestudio'; compileSdk 36
    defaultConfig { applicationId 'com.halftonestudio'; minSdk 26; targetSdk 36; testInstrumentationRunner 'com.halftonestudio.StageOneInstrumentation'; versionCode 569; versionName '3.7.0'; resValue 'string', 'privacy_policy_url', vinylPrivacyUrl }
    // Optional production signing only. No secret is stored in this source archive.
    signingConfigs {
        if (System.getenv('VINYL_RELEASE_KEYSTORE') && System.getenv('VINYL_RELEASE_ALIAS') &&
                System.getenv('VINYL_RELEASE_STORE_PASSWORD') && System.getenv('VINYL_RELEASE_KEY_PASSWORD')) {
            production {
                storeFile file(System.getenv('VINYL_RELEASE_KEYSTORE'))
                storePassword System.getenv('VINYL_RELEASE_STORE_PASSWORD')
                keyAlias System.getenv('VINYL_RELEASE_ALIAS')
                keyPassword System.getenv('VINYL_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        // Internal qualification build: same code and resources as debug, but
        // non-debuggable so ART AOT-compiles it, and <profileable shell> (see
        // src/perf/AndroidManifest.xml) so simpleperf/Perfetto can attach.
        // Debug-signed; never
        // distributed. Release privacy/R8 requirements are untouched.
        perf {
            initWith debug
            debuggable false
            // Separate sandbox: qualification runs never touch the user's projects.
            applicationIdSuffix '.perf'
            versionNameSuffix '-perf'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['debug']
        }
        release {
            if (signingConfigs.findByName('production') != null) signingConfig signingConfigs.production
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        // M8: internal R8 qualification build. Exactly the release shrinking/obfuscation
        // (initWith release: minify, shrinkResources, same ProGuard files), debug-signed,
        // non-debuggable, own sandbox (.r8) so it never touches the user's app. Not a
        // release: the release privacy gate and signing are untouched. Never distributed.
        r8qual {
            initWith release
            debuggable false
            applicationIdSuffix '.r8'
            versionNameSuffix '-r8'
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }
    // `-PvinylTestBuildType=perf` builds the androidTest APK against the perf variant.
    testBuildType = providers.gradleProperty('vinylTestBuildType').getOrElse('debug')
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

